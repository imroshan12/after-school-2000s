<title>After School '99</title>
<style>
	:root {
		color-scheme: only light;
		--teal: #008080;
		--gray: #c0c0c0;
		--dark: #808080;
		--darker: #404040;
		--light: #dfdfdf;
		--white: #ffffff;
		--black: #000000;
		--nav: #000080;
		--nav2: #1084d0;
		--gray-inactive: #7a7a7a;
		--gray-inactive2: #b5b5b5;
		--ui:
			'Pixelated MS Sans Serif', Tahoma, 'MS Sans Serif', Geneva,
			sans-serif;
	}
	* {
		box-sizing: border-box;
		margin: 0;
		padding: 0;
	}
	html,
	body {
		height: 100%;
		overflow: hidden;
		font-family: var(--ui);
		font-size: 11px;
		background: var(--teal);
		color: black;
		-webkit-user-select: none;
		user-select: none;
	}
	button {
		font-family: inherit;
		font-size: 11px;
		color: black;
	}

	/* --------- Desktop shell --------- */
	#desktop {
		position: fixed;
		inset: 0;
		background: var(--teal);
		display: flex;
		flex-direction: column;
	}
	#desk {
		flex: 1;
		position: relative;
		overflow: hidden;
	}

	/* --------- Icons --------- */
	#icons {
		position: absolute;
		top: 8px;
		left: 8px;
		display: grid;
		grid-template-columns: 76px;
		gap: 6px;
		z-index: 1;
	}
	.icon {
		background: transparent;
		border: 1px dotted transparent;
		color: white;
		font-family: inherit;
		font-size: 11px;
		width: 76px;
		padding: 4px 2px;
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: 4px;
		cursor: default;
		text-align: center;
	}
	.icon svg {
		width: 32px;
		height: 32px;
		display: block;
	}
	.icon span {
		padding: 1px 3px;
		line-height: 1.2;
		text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.9);
	}
	.icon.selected {
		border-color: #ffdd55;
	}
	.icon.selected span {
		background: var(--nav);
		text-shadow: none;
		outline: 1px dotted #fff;
		outline-offset: -1px;
	}
	.icon.selected svg {
		filter: brightness(0.7) saturate(1.4);
	}

	/* --------- Windows --------- */
	.window {
		position: absolute;
		background: var(--gray);
		border: 2px solid;
		border-color: var(--white) var(--darker) var(--darker) var(--white);
		box-shadow:
			inset 1px 1px 0 var(--light),
			inset -1px -1px 0 var(--black),
			1px 1px 0 var(--black);
		display: flex;
		flex-direction: column;
		min-width: 220px;
		min-height: 120px;
	}
	.titlebar {
		background: linear-gradient(90deg, var(--nav) 0%, var(--nav2) 100%);
		color: white;
		font-weight: bold;
		padding: 2px 2px 2px 4px;
		display: flex;
		align-items: center;
		gap: 4px;
		cursor: move;
		height: 20px;
		flex-shrink: 0;
	}
	.window.inactive .titlebar {
		background: linear-gradient(
			90deg,
			var(--gray-inactive) 0%,
			var(--gray-inactive2) 100%
		);
	}
	.tb-icon {
		width: 14px;
		height: 14px;
		flex-shrink: 0;
	}
	.tb-title {
		flex: 1;
		padding-left: 2px;
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
	}
	.tb-btns {
		display: flex;
		gap: 2px;
	}
	.tb-btn {
		width: 16px;
		height: 14px;
		background: var(--gray);
		border: 1px solid;
		border-color: var(--white) var(--darker) var(--darker) var(--white);
		box-shadow:
			inset 1px 1px 0 var(--light),
			inset -1px -1px 0 var(--black);
		padding: 0;
		display: flex;
		align-items: center;
		justify-content: center;
		cursor: default;
	}
	.tb-btn:active {
		border-color: var(--darker) var(--white) var(--white) var(--darker);
		box-shadow:
			inset 1px 1px 0 var(--black),
			inset -1px -1px 0 var(--light);
	}
	.tb-btn svg {
		pointer-events: none;
	}

	.menubar {
		display: flex;
		background: var(--gray);
		padding: 1px 2px;
		gap: 0;
		border-bottom: 1px solid var(--gray);
		flex-shrink: 0;
	}
	.menu-item {
		padding: 2px 7px;
		color: black;
		cursor: default;
		font-family: inherit;
		font-size: 11px;
		background: transparent;
		border: none;
	}
	.menu-item:hover {
		background: var(--nav);
		color: white;
	}
	.menu-item u {
		text-decoration: underline;
	}

	.body {
		flex: 1;
		overflow: auto;
		padding: 6px;
		background: var(--gray);
	}
	.body.paper {
		background: white;
		margin: 4px;
		padding: 6px;
		border: 2px solid;
		border-color: var(--darker) var(--white) var(--white) var(--darker);
		box-shadow:
			inset 1px 1px 0 var(--black),
			inset -1px -1px 0 var(--light);
	}
	.body.noscroll {
		overflow: hidden;
	}

	.status {
		display: flex;
		padding: 2px;
		gap: 2px;
		background: var(--gray);
		flex-shrink: 0;
	}
	.status-cell {
		padding: 1px 6px;
		border: 1px solid;
		border-color: var(--darker) var(--white) var(--white) var(--darker);
		flex: 1;
	}

	.btn {
		background: var(--gray);
		border: 2px solid;
		border-color: var(--white) var(--darker) var(--darker) var(--white);
		box-shadow:
			inset 1px 1px 0 var(--light),
			inset -1px -1px 0 var(--black);
		padding: 3px 12px;
		font-family: inherit;
		font-size: 11px;
		color: black;
		cursor: default;
		min-width: 68px;
	}
	.btn:active,
	.btn.pressed {
		border-color: var(--darker) var(--white) var(--white) var(--darker);
		box-shadow:
			inset 1px 1px 0 var(--black),
			inset -1px -1px 0 var(--light);
	}
	.btn:focus {
		outline: 1px dotted black;
		outline-offset: -4px;
	}

	.field,
	input[type='text'],
	textarea {
		background: white;
		border: 2px solid;
		border-color: var(--darker) var(--white) var(--white) var(--darker);
		box-shadow:
			inset 1px 1px 0 var(--black),
			inset -1px -1px 0 var(--light);
		padding: 2px 4px;
		font-family: inherit;
		font-size: 11px;
		color: black;
	}
	textarea {
		resize: none;
	}

	/* --------- Taskbar --------- */
	#taskbar {
		height: 28px;
		flex-shrink: 0;
		background: var(--gray);
		border-top: 1px solid var(--white);
		box-shadow: inset 0 1px 0 var(--white);
		display: flex;
		align-items: center;
		padding: 2px;
		gap: 3px;
		position: relative;
		z-index: 900;
	}
	#start-btn {
		display: flex;
		align-items: center;
		gap: 4px;
		padding: 2px 6px 2px 4px;
		min-width: 0;
		font-weight: bold;
		height: 22px;
	}
	#start-btn svg {
		width: 16px;
		height: 16px;
	}

	.tb-sep {
		width: 2px;
		height: 22px;
		background: linear-gradient(
			to right,
			var(--dark) 50%,
			var(--white) 50%
		);
	}
	#tb-tasks {
		flex: 1;
		display: flex;
		gap: 3px;
		overflow: hidden;
		padding-left: 3px;
	}
	.tb-task {
		display: flex;
		align-items: center;
		gap: 4px;
		padding: 2px 6px;
		min-width: 130px;
		max-width: 180px;
		height: 22px;
		justify-content: flex-start;
		font-weight: normal;
		overflow: hidden;
	}
	.tb-task svg {
		width: 14px;
		height: 14px;
		flex-shrink: 0;
	}
	.tb-task span {
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
		flex: 1;
		text-align: left;
	}
	.tb-task.active {
		border-color: var(--darker) var(--white) var(--white) var(--darker);
		box-shadow:
			inset 1px 1px 0 var(--black),
			inset -1px -1px 0 var(--light);
		background-image: repeating-linear-gradient(
			45deg,
			transparent 0 2px,
			rgba(255, 255, 255, 0.5) 2px 4px
		);
	}
	#tray {
		display: flex;
		align-items: center;
		gap: 8px;
		padding: 0 8px;
		height: 22px;
		border: 1px solid;
		border-color: var(--darker) var(--white) var(--white) var(--darker);
		font-size: 11px;
	}
	#tray-clock {
		min-width: 46px;
		text-align: center;
		font-variant-numeric: tabular-nums;
	}
	#tray svg {
		width: 14px;
		height: 14px;
		opacity: 0.85;
	}

	/* --------- Start menu --------- */
	#start-menu {
		position: absolute;
		bottom: 30px;
		left: 2px;
		width: 200px;
		background: var(--gray);
		border: 2px solid;
		border-color: var(--white) var(--darker) var(--darker) var(--white);
		box-shadow:
			inset 1px 1px 0 var(--light),
			inset -1px -1px 0 var(--black),
			2px 2px 4px rgba(0, 0, 0, 0.5);
		display: flex;
		z-index: 901;
	}
	#start-menu.hidden {
		display: none;
	}
	#sm-side {
		width: 24px;
		background: linear-gradient(to top, #7a7a7a 0%, #000080 100%);
		color: white;
		padding: 4px 0;
		font-family: 'Arial Black', Arial, sans-serif;
		font-size: 20px;
		font-weight: 900;
		font-style: italic;
		letter-spacing: 2px;
		writing-mode: vertical-rl;
		transform: rotate(180deg);
		text-align: right;
		padding-right: 6px;
		line-height: 1;
	}
	#sm-side b {
		color: white;
	}
	#sm-side i {
		color: #c0c0c0;
		font-style: italic;
		font-weight: 400;
	}
	#sm-items {
		flex: 1;
		padding: 2px;
	}
	.sm-item {
		display: flex;
		align-items: center;
		gap: 8px;
		padding: 5px 12px 5px 6px;
		color: black;
		cursor: default;
		font-size: 11px;
		background: transparent;
		border: none;
		width: 100%;
		text-align: left;
		font-family: inherit;
	}
	.sm-item svg {
		width: 22px;
		height: 22px;
		flex-shrink: 0;
	}
	.sm-item:hover {
		background: var(--nav);
		color: white;
	}
	.sm-item.has-sub::after {
		content: '▶';
		margin-left: auto;
		font-size: 8px;
	}
	.sm-sep {
		height: 1px;
		background: var(--dark);
		box-shadow: 0 1px 0 var(--white);
		margin: 3px 2px;
	}

	/* --------- Boot screen --------- */
	#boot {
		position: fixed;
		inset: 0;
		background: black;
		color: #c0c0c0;
		z-index: 99999;
		font-family: 'Courier New', monospace;
		padding: 20px;
		font-size: 13px;
		line-height: 1.4;
	}
	#boot.win {
		background: #000;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		padding: 0;
		color: white;
	}
	#boot-logo {
		width: min(60vw, 400px);
		aspect-ratio: 4/1;
		display: grid;
		grid-template-columns: 1fr 2fr;
		align-items: center;
		gap: 20px;
		margin-bottom: 30px;
	}
	#boot-flag {
		display: grid;
		grid-template-columns: 1fr 1fr;
		grid-template-rows: 1fr 1fr;
		gap: 4px;
		aspect-ratio: 1;
		transform: perspective(200px) rotateY(-15deg);
	}
	#boot-flag > div:nth-child(1) {
		background: #ff0000;
	}
	#boot-flag > div:nth-child(2) {
		background: #00ff00;
	}
	#boot-flag > div:nth-child(3) {
		background: #0000ff;
	}
	#boot-flag > div:nth-child(4) {
		background: #ffff00;
	}
	#boot-text {
		color: white;
		font-family: Arial, sans-serif;
	}
	#boot-text .big {
		font-size: 32px;
		font-weight: 300;
	}
	#boot-text .small {
		font-size: 12px;
		opacity: 0.8;
		letter-spacing: 4px;
	}
	#boot-bar {
		width: min(60vw, 400px);
		height: 12px;
		background: #000;
		border: 1px solid #333;
		overflow: hidden;
		position: relative;
	}
	#boot-bar::before {
		content: '';
		position: absolute;
		inset: 0;
		background: repeating-linear-gradient(
			90deg,
			#000 0 4px,
			#003366 4px 6px,
			#0066cc 6px 8px,
			#003366 8px 10px,
			#000 10px 12px
		);
		animation: bootbar 1.2s linear infinite;
		width: 40px;
	}
	@keyframes bootbar {
		from {
			transform: translateX(-40px);
		}
		to {
			transform: translateX(calc(60vw + 40px));
		}
	}
	#boot-skip {
		position: absolute;
		bottom: 10px;
		right: 12px;
		color: #666;
		font-size: 10px;
		font-family: inherit;
	}
	#boot.gone {
		display: none;
	}

	/* --------- App-specific --------- */
	/* MSN Messenger */
	.msn {
		display: flex;
		flex-direction: column;
		height: 100%;
	}
	.msn-head {
		display: flex;
		align-items: center;
		gap: 8px;
		padding: 6px;
		background: linear-gradient(to bottom, #e9f1fa, #c6def7);
		border-bottom: 1px solid var(--dark);
	}
	.msn-avatar {
		width: 40px;
		height: 40px;
		background: #ffcc99;
		border-radius: 50%;
		border: 2px solid white;
		box-shadow: 0 0 0 1px var(--dark);
		display: grid;
		place-items: center;
		font-size: 20px;
	}
	.msn-nick {
		font-weight: bold;
		font-size: 12px;
		color: #003366;
	}
	.msn-status {
		font-size: 10px;
		color: #006600;
	}
	.msn-log {
		flex: 1;
		overflow-y: auto;
		background: white;
		padding: 6px;
		font-family: Tahoma, sans-serif;
		font-size: 12px;
		border: 2px solid;
		border-color: var(--darker) var(--white) var(--white) var(--darker);
		margin: 4px;
	}
	.msn-msg {
		margin-bottom: 4px;
		line-height: 1.4;
	}
	.msn-msg b.me {
		color: #c00000;
	}
	.msn-msg b.them {
		color: #0066cc;
	}
	.msn-typing {
		color: var(--dark);
		font-style: italic;
		padding: 2px 6px;
		height: 18px;
		font-size: 11px;
	}
	.msn-input {
		display: flex;
		gap: 4px;
		padding: 4px;
		border-top: 1px solid var(--dark);
	}
	.msn-input textarea {
		flex: 1;
		height: 44px;
	}
	.msn-nudge {
		background: none;
		border: none;
		cursor: default;
		padding: 2px 6px;
		font-size: 10px;
		color: var(--nav);
		text-decoration: underline;
	}
	@keyframes nudge {
		0%,
		100% {
			transform: translate(0, 0);
		}
		10% {
			transform: translate(-6px, -3px);
		}
		20% {
			transform: translate(6px, 3px);
		}
		30% {
			transform: translate(-4px, 4px);
		}
		40% {
			transform: translate(4px, -4px);
		}
		50% {
			transform: translate(-6px, 0);
		}
		60% {
			transform: translate(6px, 0);
		}
		70% {
			transform: translate(0, -6px);
		}
		80% {
			transform: translate(0, 6px);
		}
		90% {
			transform: translate(-2px, -2px);
		}
	}
	.nudging {
		animation: nudge 0.6s ease-in-out;
	}

	/* Winamp */
	.winamp {
		background: #232323;
		color: #00ff00;
		font-family: 'Lucida Console', 'Courier New', monospace;
		padding: 6px;
		min-width: 250px;
		border: 1px solid #000;
		box-shadow:
			inset 1px 1px 0 #555,
			inset -1px -1px 0 #000;
	}
	.winamp-lcd {
		background: #000;
		border: 1px solid #444;
		padding: 4px 6px;
		display: flex;
		justify-content: space-between;
		align-items: center;
		font-size: 11px;
		text-shadow: 0 0 4px #00ff66;
		margin-bottom: 6px;
	}
	.winamp-title {
		overflow: hidden;
		white-space: nowrap;
		max-width: 160px;
	}
	.winamp-title .marq {
		display: inline-block;
		padding-left: 100%;
		animation: marq 12s linear infinite;
	}
	@keyframes marq {
		to {
			transform: translateX(-100%);
		}
	}
	.winamp-eq {
		display: flex;
		align-items: flex-end;
		gap: 2px;
		height: 40px;
		padding: 4px;
		background: #000;
		border: 1px solid #444;
		margin-bottom: 6px;
	}
	.winamp-eq div {
		flex: 1;
		background: linear-gradient(to top, #00ff00, #ffff00 60%, #ff0000);
		min-height: 4px;
		transition: height 0.15s;
	}
	.winamp-controls {
		display: flex;
		gap: 4px;
		justify-content: space-between;
		margin-top: 6px;
	}
	.winamp-controls button {
		background: #333;
		color: #00ff00;
		border: 1px solid #666;
		padding: 3px 8px;
		font-family: inherit;
		font-size: 11px;
		cursor: default;
	}
	.winamp-controls button:hover {
		background: #444;
	}
	.winamp-playlist {
		background: #000;
		color: #ffff00;
		padding: 4px;
		margin-top: 6px;
		border: 1px solid #444;
		font-size: 11px;
		max-height: 130px;
		overflow-y: auto;
	}
	.winamp-playlist div {
		padding: 1px 4px;
		cursor: default;
	}
	.winamp-playlist div:hover {
		background: #223;
	}
	.winamp-playlist div.current {
		background: #005500;
		color: #fff;
	}
	.winamp-tag {
		color: #00ff00;
		font-size: 10px;
		text-align: center;
		opacity: 0.7;
		margin-top: 6px;
		font-style: italic;
	}

	/* Minesweeper */
	.mine-head {
		display: flex;
		justify-content: space-between;
		padding: 4px;
		border: 2px solid;
		border-color: var(--darker) var(--white) var(--white) var(--darker);
		margin-bottom: 4px;
	}
	.mine-lcd {
		background: black;
		color: #ff0000;
		font-family: 'Courier New', monospace;
		padding: 2px 6px;
		font-size: 18px;
		font-weight: bold;
		min-width: 44px;
		text-align: center;
		letter-spacing: 2px;
	}
	.mine-face {
		width: 28px;
		height: 28px;
		padding: 0;
		background: var(--gray);
		display: grid;
		place-items: center;
		font-size: 18px;
	}
	.mine-grid {
		display: grid;
		border: 2px solid;
		border-color: var(--darker) var(--white) var(--white) var(--darker);
		background: var(--gray);
		padding: 2px;
		width: fit-content;
		margin: 0 auto;
	}
	.cell {
		width: 20px;
		height: 20px;
		background: var(--gray);
		border: 2px solid;
		border-color: var(--white) var(--darker) var(--darker) var(--white);
		display: grid;
		place-items: center;
		font-family: 'Courier New', monospace;
		font-weight: bold;
		font-size: 14px;
		cursor: default;
		padding: 0;
	}
	.cell.open {
		border: 1px solid var(--dark);
		background: var(--gray);
		box-shadow: none;
	}
	.cell.mine {
		background: red;
	}
	.cell.n1 {
		color: blue;
	}
	.cell.n2 {
		color: green;
	}
	.cell.n3 {
		color: red;
	}
	.cell.n4 {
		color: darkblue;
	}
	.cell.n5 {
		color: darkred;
	}

		const MIN_SVG = `<svg width="9" height="8" viewBox="0 0 9 8"><rect x="1" y="6" width="7" height="1.5" fill="black"/></svg>`
		const MAX_SVG = `<svg width="9" height="8" viewBox="0 0 9 8"><rect x="1" y="0.5" width="7" height="7" fill="none" stroke="black" stroke-width="1"/><rect x="1" y="0.5" width="7" height="1.5" fill="black"/></svg>`

		function createWindow(cfg) {
			// cfg: { title, iconSvg, w, h, x, y, contentEl, singleton?, appId, noMinimize? }
			if (cfg.singleton) {
				for (const [id, w] of openWindows) {
					if (w.cfg.appId === cfg.appId) {
						focusWindow(id)
						return w
					}
				}
			}
			const id = ++winId
			const el = document.createElement('div')
			el.className = 'window'
			el.style.width = (cfg.w || 320) + 'px'
			if (cfg.h) el.style.height = cfg.h + 'px'
			const rect = document.getElementById('desk').getBoundingClientRect()
			const offset = (openWindows.size % 6) * 24
			const x =
				cfg.x != null ?
					cfg.x
				:	Math.max(20, (rect.width - (cfg.w || 320)) / 2 - 60 + offset)
			const y =
				cfg.y != null ?
					cfg.y
				:	Math.max(20, (rect.height - (cfg.h || 300)) / 2 - 60 + offset)
			el.style.left = x + 'px'
			el.style.top = y + 'px'
			el.style.zIndex = ++zCounter

			const tb = document.createElement('div')
			tb.className = 'titlebar'
			tb.innerHTML = `
      <div class="tb-icon">${cfg.iconSvg || ''}</div>
      <div class="tb-title">${cfg.title}</div>
      <div class="tb-btns">
        <button class="tb-btn" data-act="min" title="Minimize">${MIN_SVG}</button>
        <button class="tb-btn" data-act="max" title="Maximize">${MAX_SVG}</button>
        <button class="tb-btn" data-act="close" title="Close">${CLOSE_SVG}</button>
      </div>
    `
			el.appendChild(tb)
			if (cfg.contentEl) el.appendChild(cfg.contentEl)
			layer.appendChild(el)

			el.addEventListener('mousedown', () => focusWindow(id), true)
			el.addEventListener('touchstart', () => focusWindow(id), {
				passive: true,
				capture: true,
			})

			tb.querySelector('[data-act=close]').addEventListener(
				'click',
				(e) => {
					e.stopPropagation()
					closeWindow(id)
				},
			)
			tb.querySelector('[data-act=min]').addEventListener(
				'click',
				(e) => {
					e.stopPropagation()
					minWindow(id)
				},
			)
			tb.querySelector('[data-act=max]').addEventListener(
				'click',
				(e) => {
					e.stopPropagation()
					maxWindow(id)
				},
			)

			makeDraggable(el, tb)
			tb.addEventListener('dblclick', () => maxWindow(id))

			// Taskbar button
			const tbBtn = document.createElement('button')
			tbBtn.className = 'btn tb-task'
			tbBtn.innerHTML = `${cfg.iconSvg || ''}<span>${cfg.title}</span>`
			tbBtn.addEventListener('click', () => {
				if (el.dataset.minimized === '1') restoreWindow(id)
				else if (getComputedStyle(el).zIndex == zCounter) minWindow(id)
				else focusWindow(id)
			})
			tbTasks.appendChild(tbBtn)

			const record = { el, taskBtn: tbBtn, cfg, savedRect: null }
			openWindows.set(id, record)
			focusWindow(id)
			chime()
			return record
		}

		function focusWindow(id) {
			const rec = openWindows.get(id)
			if (!rec) return
			document
				.querySelectorAll('.window')
				.forEach((w) => w.classList.add('inactive'))
			document
				.querySelectorAll('.tb-task')
				.forEach((b) => b.classList.remove('active'))
			rec.el.classList.remove('inactive')
			rec.el.style.zIndex = ++zCounter
			rec.taskBtn.classList.add('active')
			if (rec.el.dataset.minimized === '1') restoreWindow(id)
		}
		function closeWindow(id) {
			const rec = openWindows.get(id)
			if (!rec) return
			rec.el.remove()
			rec.taskBtn.remove()
			openWindows.delete(id)
			if (rec.cfg.onClose) rec.cfg.onClose()
		}
		function minWindow(id) {
			const rec = openWindows.get(id)
			if (!rec) return
			rec.el.style.display = 'none'
			rec.el.dataset.minimized = '1'
			rec.taskBtn.classList.remove('active')
		}
		function restoreWindow(id) {
			const rec = openWindows.get(id)
			if (!rec) return
			rec.el.style.display = 'flex'
			rec.el.dataset.minimized = ''
			focusWindow(id)
		}
		function maxWindow(id) {
			const rec = openWindows.get(id)
			if (!rec) return
			const rect = document.getElementById('desk').getBoundingClientRect()
			if (rec.savedRect) {
				const s = rec.savedRect
				rec.el.style.left = s.left + 'px'
				rec.el.style.top = s.top + 'px'
				rec.el.style.width = s.width + 'px'
				rec.el.style.height = s.height + 'px'
				rec.savedRect = null
			} else {
				rec.savedRect = {
					left: parseInt(rec.el.style.left),
					top: parseInt(rec.el.style.top),
					width: rec.el.offsetWidth,
					height: rec.el.offsetHeight,
				}
				rec.el.style.left = '0px'
				rec.el.style.top = '0px'
				rec.el.style.width = rect.width + 'px'
				rec.el.style.height = rect.height + 'px'
			}
		}

		function makeDraggable(el, handle) {
			let dragging = false,
				ox = 0,
				oy = 0
			function down(e) {
				if (e.target.closest('.tb-btn')) return
				dragging = true
				const p = e.touches ? e.touches[0] : e
				const r = el.getBoundingClientRect()
				ox = p.clientX - r.left
				oy = p.clientY - r.top
				document.body.style.cursor = 'move'
				e.preventDefault()
			}
			function move(e) {
				if (!dragging) return
				const p = e.touches ? e.touches[0] : e
				const rect = document
					.getElementById('desk')
					.getBoundingClientRect()
				let x = p.clientX - ox - rect.left
				let y = p.clientY - oy - rect.top
				x = Math.max(-el.offsetWidth + 40, Math.min(rect.width - 40, x))
				y = Math.max(0, Math.min(rect.height - 24, y))
				el.style.left = x + 'px'
				el.style.top = y + 'px'
			}
			function up() {
				dragging = false
				document.body.style.cursor = ''
			}
			handle.addEventListener('mousedown', down)
			handle.addEventListener('touchstart', down, { passive: false })
			document.addEventListener('mousemove', move)
			document.addEventListener('touchmove', move, { passive: false })
			document.addEventListener('mouseup', up)
			document.addEventListener('touchend', up)
		}

			const body = document.createElement('div')

			body.innerHTML = `
      <div class="mine-head">
        <div class="mine-lcd" id="ms-flags">010</div>

    `
			createWindow({
				title: 'Minesweeper',
				iconSvg: ICONS.mines,
				w: 220,
				h: 280,
				contentEl: body,
				appId: 'mines',
				singleton: true,
			})

			const grid = body.querySelector('#ms-grid')
			const face = body.querySelector('#ms-face')
			const flagsEl = body.querySelector('#ms-flags')
			const timeEl = body.querySelector('#ms-time')
			let cells,
				mines,
				revealed,
				flagged,
				gameOver,
				won,
				started,
				startTime,
				timer,
				flags
			function newGame() {
				cells = Array.from({ length: H }, () => Array(W).fill(0))
				revealed = Array.from({ length: H }, () => Array(W).fill(false))
				flagged = Array.from({ length: H }, () => Array(W).fill(false))
				gameOver = false
				won = false
				started = false
				flags = 0
				face.textContent = '🙂'
				flagsEl.textContent = String(MINES).padStart(3, '0')
				timeEl.textContent = '000'
				if (timer) clearInterval(timer)
				// Place mines
				let placed = 0
				while (placed < MINES) {
					const r = Math.floor(Math.random() * H),
						c = Math.floor(Math.random() * W)
					if (cells[r][c] === -1) continue
					cells[r][c] = -1
					placed++
				}
				// Compute counts
				for (let r = 0; r < H; r++)
					for (let c = 0; c < W; c++) {
						if (cells[r][c] === -1) continue
						let n = 0
						for (let dr = -1; dr <= 1; dr++)
							for (let dc = -1; dc <= 1; dc++) {
								const nr = r + dr,
									nc = c + dc
								if (nr < 0 || nc < 0 || nr >= H || nc >= W)
									continue
								if (cells[nr][nc] === -1) n++
							}
						cells[r][c] = n
					}
				render()
			}
			function render() {
				grid.innerHTML = ''
				for (let r = 0; r < H; r++)
					for (let c = 0; c < W; c++) {
						const b = document.createElement('button')
						b.className = 'cell'
						if (revealed[r][c]) {
							b.classList.add('open')
							if (cells[r][c] === -1) {
								b.classList.add('mine')
								b.textContent = '💣'
							} else if (cells[r][c] > 0) {
								b.classList.add('n' + cells[r][c])
								b.textContent = cells[r][c]
							}
						} else if (flagged[r][c]) {
							b.textContent = '🚩'
						}
						b.addEventListener('click', (e) => {
							e.preventDefault()
							if (!gameOver) reveal(r, c)
						})
						b.addEventListener('contextmenu', (e) => {
							e.preventDefault()
							if (!gameOver) toggleFlag(r, c)
						})
						grid.appendChild(b)
					}
			}
			function startTimer() {
				startTime = Date.now()
				timer = setInterval(() => {
					timeEl.textContent = String(
						Math.min(
							999,
							Math.floor((Date.now() - startTime) / 1000),
						),
					).padStart(3, '0')
				}, 500)
			}
			function reveal(r, c) {
				if (revealed[r][c] || flagged[r][c]) return
				if (!started) {
					started = true
					startTimer()
				}
				revealed[r][c] = true
				if (cells[r][c] === -1) {
					gameOver = true
					face.textContent = '😵'
					clearInterval(timer)
					revealAll()
					render()
					return
				}
				if (cells[r][c] === 0) {
					for (let dr = -1; dr <= 1; dr++)
						for (let dc = -1; dc <= 1; dc++) {
							const nr = r + dr,
								nc = c + dc
							if (nr < 0 || nc < 0 || nr >= H || nc >= W) continue
							if (!revealed[nr][nc]) reveal(nr, nc)
						}
				}
				checkWin()
				render()
			}
			function revealAll() {
				for (let r = 0; r < H; r++)
					for (let c = 0; c < W; c++)
						if (cells[r][c] === -1) revealed[r][c] = true
			}
			function toggleFlag(r, c) {
				if (revealed[r][c]) return
				flagged[r][c] = !flagged[r][c]
				flags += flagged[r][c] ? 1 : -1
				flagsEl.textContent = String(MINES - flags).padStart(3, '0')
				render()
			}
			function checkWin() {
				let unrevealed = 0
				for (let r = 0; r < H; r++)
					for (let c = 0; c < W; c++)
						if (!revealed[r][c]) unrevealed++
				if (unrevealed === MINES) {
					won = true
					gameOver = true
					face.textContent = '😎'
					clearInterval(timer)
				}
			}

		}

			ctx.fillRect(0, 0, canvas.width, canvas.height)
			ctx.lineWidth = 2
			ctx.lineCap = 'round'
			function pos(e) {
				const r = canvas.getBoundingClientRect()
				const p = e.touches ? e.touches[0] : e
				return { x: p.clientX - r.left, y: p.clientY - r.top }
			}
			function start(e) {
				painting = true
				const { x, y } = pos(e)
				lastX = x
				lastY = y
				e.preventDefault()
			}

				if (!painting) return
				const { x, y } = pos(e)
				ctx.strokeStyle = currentColor
				ctx.beginPath()
				ctx.moveTo(lastX, lastY)
				ctx.lineTo(x, y)
				ctx.stroke()
				lastX = x
				lastY = y
				e.preventDefault()
			}
			function end() {
				painting = false
			}
			canvas.addEventListener('mousedown', start)
			canvas.addEventListener('mousemove', draw)
			canvas.addEventListener('mouseup', end)
			canvas.addEventListener('mouseleave', end)
			canvas.addEventListener('touchstart', start, { passive: false })
			canvas.addEventListener('touchmove', draw, { passive: false })
			canvas.addEventListener('touchend', end)

			)[0]
			body.querySelector('.dlg-cancel').addEventListener('click', () => {
				closeWindow(id)
				overlay.remove()
			})
			body.querySelector('.dlg-ok').addEventListener('click', () => {
				closeWindow(id)
				overlay.remove()
				const screen = document.createElement('div')
				screen.style.cssText =
					'position:fixed;inset:0;background:#000;color:#FFA500;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Courier New",monospace;text-align:center;z-index:9999999;font-size:16px;line-height:2;padding:20px;'
				screen.innerHTML = `<div style="font-size:20px;font-weight:bold;">It's now safe to turn off<br>your computer.</div><br><br><button class="btn" style="padding:6px 14px;">Click here to boot again</button>`
				document.body.appendChild(screen)
				screen
					.querySelector('button')
					.addEventListener('click', () => location.reload())
			})
		}

		function toggleStart() {
			startMenu.classList.toggle('hidden')
			startBtn.classList.toggle(
				'active',
				!startMenu.classList.contains('hidden'),
			)
		}
		function closeStart() {
			startMenu.classList.add('hidden')
			startBtn.classList.remove('active')
		}
		startBtn.addEventListener('click', (e) => {
			e.stopPropagation()
			toggleStart()
		})
		document.addEventListener('click', (e) => {
			if (
				!startMenu.contains(e.target) &&
				e.target !== startBtn &&
				!startBtn.contains(e.target)
			)
				closeStart()
		})

		// ---------- Clock ----------
		function tick() {
			const d = new Date()
			let h = d.getHours(),
				m = d.getMinutes()
			const ampm = h >= 12 ? 'PM' : 'AM'
			h = h % 12
			if (h === 0) h = 12
			document.getElementById('tray-clock').textContent =
				`${h}:${String(m).padStart(2, '0')} ${ampm}`
		}
		tick()
		setInterval(tick, 15000)

		// ---------- Notification toast (MSN) ----------
		function msnToast() {
			if ([...openWindows.values()].some((r) => r.cfg.appId === 'msn'))
				return
			const t = document.createElement('div')
			t.className = 'toast'
			t.innerHTML = `<span class="x">✕</span><b>MSN Messenger</b><br><span style="color:#080;">●</span> <b>~*xX_CrAzYgUrL_99_Xx*~</b> just signed in.<br><i style="color:#666;">click to say hi</i>`
			document.getElementById('desk').appendChild(t)
			nudgeSound()
			t.addEventListener('click', (e) => {
				if (e.target.classList.contains('x')) {
					t.remove()
					return
				}
				t.remove()
				openApp('msn')
			})
			setTimeout(() => t.remove(), 12000)
		}

		// ---------- Boot ----------
		const boot = document.getElementById('boot')
		let bootDone = false
		function finishBoot() {
			if (bootDone) return
			bootDone = true
			boot.classList.add('gone')
			chime()
			// Play startup arpeggio
			;[523, 659, 784, 1047].forEach((f, i) =>
				setTimeout(() => beep(f, 0.16, 'sine', 0.06), i * 120),
			)
			// Auto-select first icon
			document.querySelector('.icon')?.classList.add('selected')
			// Auto-open apps after boot
			setTimeout(() => openApp('notepad'), 700)
			setTimeout(() => openApp('ie'), 1300)
			setTimeout(() => openApp('msn'), 1900)
		}
		boot.addEventListener('click', finishBoot)
		setTimeout(finishBoot, 3800)
	})()
</script>
